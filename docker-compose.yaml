services:
  youtube-scraper:
    build: .
    image: youtube-scraper:local
    init: true
    restart: unless-stopped
    # Fami on ai-routing reaches this service by DNS; no host port is exposed.
    networks:
      - ai-routing
    environment:
      PORT: 8000
      MCP_HOST: 0.0.0.0
      MCP_TOOL_TIMEOUT: ${MCP_TOOL_TIMEOUT:-45}
      MCP_MAX_CONCURRENCY: ${MCP_MAX_CONCURRENCY:-4}
      MCP_CACHE_SIZE: ${MCP_CACHE_SIZE:-500}
      YOUTUBE_PROXY: ${YOUTUBE_PROXY:-}
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Initial estimates. Measure peak use on the homeserver after deployment.
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

networks:
  ai-routing:
    external: true
    name: ai-routing
